name: iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Flutter Project & Build
        run: |
          # Pronađi folder u kom se nalazi pubspec.yaml
          FLUTTER_DIR=$(dirname $(find . -maxdepth 3 -name "pubspec.yaml" -print -quit))
          echo "Pronađen Flutter projekat u: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          
          # Pokreni install i build
          flutter pub get
          flutter build ios --release --no-codesign
          
          # Zapakuj IPA fajl
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r CatFeeder.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatFeeder-IPA
          path: "**/build/ios/ipa/CatFeeder.ipa"
